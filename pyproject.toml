[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ocean-climate"
version = "0.5.0"
description = "Climate patterns vs ocean profiles analysis and plotting"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">= 3.9"
authors = [
    {name = "Tyler Pachuda", email = "typa7327@colorado.edu"},
]
dependencies = [
    "numpy >= 1.22",
    "matplotlib >= 3.5",
]

[project.optional-dependencies]
dev = ["build", "twine"]

[project.scripts]
run-ocean_climate = "ocean_climate-Project.ocean_climate_ensemble:main"