[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ocean-climate-typa7327"
version = "1.0.0"
description = "Climate patterns vs ocean profiles analysis and plotting"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">= 3.9"
authors = [
    {name = "Tyler Pachuda", email = "typa7327@colorado.edu"},
]
dependencies = [
    "numpy >= 1.22",
    "matplotlib >= 3.5",
]

[project.optional-dependencies]
dev = ["build", "twine"]

[project.scripts]
run-ocean_climate = "ocean_climate_Project.ocn_cli_analysis.ocean_climate_ensemble:main"